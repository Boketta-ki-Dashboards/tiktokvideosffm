name: Video rendern

# Manuell starten: GitHub → Actions → „Video rendern“ → „Run workflow“.
# Ergebnis: MP4 (+ Cover-Bild + Prüfbericht) als herunterladbares Artefakt.

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion-Komposition (ID, siehe src/Root.tsx)
        required: true
        default: FrankfurtHeadlines
        type: string
      voice:
        description: "Sprecherspur: repo = vorhandene Spur · import = voice-input/<video_id>.mp3|wav|m4a · piper = kostenlos neu erzeugen · none = stumm"
        required: true
        default: repo
        type: choice
        options:
          - repo
          - import
          - piper
          - none
      video_id:
        description: Video-Ordner unter src/videos/ (für voice = piper/none)
        required: true
        default: frankfurt-2026-10-31
        type: string
      crf:
        description: "Qualität (CRF 14–28, kleiner = besser/größer)"
        required: true
        default: "18"
        type: string
      cover:
        description: Titelbild (Cover-PNG) mitrendern, falls „<Komposition>-Cover“ existiert
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}-${{ inputs.composition }}
  cancel-in-progress: false

jobs:
  render:
    name: Rendern & prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSITION: ${{ inputs.composition }}
      VOICE_MODE: ${{ inputs.voice }}
      VIDEO_ID: ${{ inputs.video_id }}
      CRF: ${{ inputs.crf }}
      RENDER_COVER: ${{ inputs.cover }}

    steps:
      - name: Eingaben prüfen
        run: |
          [[ "$COMPOSITION" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::Ungültige Komposition: $COMPOSITION"; exit 1; }
          [[ "$VIDEO_ID" =~ ^[a-z0-9_-]+$ ]] || { echo "::error::Ungültige video_id: $VIDEO_ID"; exit 1; }
          [[ "$CRF" =~ ^[0-9]{1,2}$ ]] && (( CRF >= 10 && CRF <= 35 )) || { echo "::error::CRF muss zwischen 10 und 35 liegen"; exit 1; }

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: FFmpeg installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chrome Headless Shell für Remotion bereitstellen
        run: npx remotion browser ensure

      - name: TypeScript prüfen
        run: npm run typecheck

      # ---------- Stimme ----------
      - name: Python für Piper einrichten
        if: env.VOICE_MODE == 'piper'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Piper-Stimmmodell aus Cache laden
        if: env.VOICE_MODE == 'piper'
        uses: actions/cache@v4
        with:
          path: .cache/piper-voices
          key: piper-voices-${{ hashFiles(format('src/videos/{0}/script.json', inputs.video_id)) }}
          restore-keys: piper-voices-

      - name: Sprecherspur mit Piper erzeugen (kostenlos, offline)
        if: env.VOICE_MODE == 'piper'
        run: |
          VOICE_NAME=$(node -p "require('./src/videos/${VIDEO_ID}/script.json').voice?.piperModel ?? 'de_DE-thorsten-high'")
          bash scripts/voice/setup-piper.sh "$VOICE_NAME"
          node scripts/voice/piper-tts.mjs --video "$VIDEO_ID"

      - name: Hochgeladene Sprecherdatei importieren (voice-input/)
        if: env.VOICE_MODE == 'import'
        run: |
          FILE=""
          for EXT in mp3 wav m4a aac ogg flac; do
            [ -f "voice-input/${VIDEO_ID}.${EXT}" ] && FILE="voice-input/${VIDEO_ID}.${EXT}" && break
          done
          if [ -z "$FILE" ]; then
            echo "::error::Keine Datei voice-input/${VIDEO_ID}.(mp3|wav|m4a|aac|ogg|flac) gefunden."
            exit 1
          fi
          node scripts/voice/import-voice.mjs --video "$VIDEO_ID" --file "$FILE"

      - name: Stumme Fassung vorbereiten
        if: env.VOICE_MODE == 'none'
        run: node scripts/voice/estimate-manifest.mjs --video "$VIDEO_ID"

      - name: Sprecherspur aus dem Repository prüfen
        if: env.VOICE_MODE == 'repo'
        run: |
          FILE="src/videos/${VIDEO_ID}/voiceover.json"
          if [ -f "$FILE" ]; then
            node -e "const m=require('./$FILE'); console.log('Quelle:', m.source, '| Datei:', m.audioFile ?? '(keine – stumm)', '| Sprechzeit:', (m.durationMs/1000).toFixed(2)+' s')"
          else
            echo "Kein Manifest für $VIDEO_ID gefunden – Komposition nutzt eigene Standardwerte."
          fi

      # ---------- Rendern ----------
      - name: Video rendern (H.264, 1080×1920, 30 fps)
        run: |
          AUDIO_FLAG=""
          [ "$VOICE_MODE" = "none" ] && AUDIO_FLAG="--allow-no-audio"
          node scripts/render.mjs "$COMPOSITION" \
            --out "output/${COMPOSITION}.mp4" \
            --crf "$CRF" \
            --json "output/${COMPOSITION}.report.json" \
            $AUDIO_FLAG

      - name: Cover-Bild rendern
        if: env.RENDER_COVER == 'true'
        run: |
          if npx remotion compositions src/index.ts 2>/dev/null | grep -q "^${COMPOSITION}-Cover "; then
            npx remotion still src/index.ts "${COMPOSITION}-Cover" "output/${COMPOSITION}-cover.png"
          else
            echo "Keine Cover-Komposition „${COMPOSITION}-Cover“ vorhanden – übersprungen."
          fi

      - name: Export erneut verifizieren
        run: |
          AUDIO_FLAG=""
          [ "$VOICE_MODE" = "none" ] && AUDIO_FLAG="--allow-no-audio"
          node scripts/verify-video.mjs "output/${COMPOSITION}.mp4" $AUDIO_FLAG
          ls -la output/

      - name: Video als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-run${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.png
            output/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
